<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Study Planner</title>
  <style>
:root {
  --bg: #f4f1fb;
  --surface: #ffffff;
  --ink: #1e1b33;
  --ink-soft: #635d80;
  --line: #e8e3f4;
  --brand: #6c4bd4;
  --brand-dark: #4a2fa8;
  --brand-soft: #efeafd;
  --accent: #12a888;
  --danger: #d9465f;
  --high: #e0503f;
  --normal: #d68a1c;
  --low: #3a86d6;
  --radius: 14px;
  --shadow: 0 12px 32px rgba(58, 40, 110, 0.10);
  --shadow-sm: 0 2px 8px rgba(58, 40, 110, 0.07);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: radial-gradient(1100px 560px at 8% -12%, #e6dcff 0%, transparent 62%),
              radial-gradient(900px 500px at 100% 0%, #d9f4ee 0%, transparent 55%),
              var(--bg);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  padding: 28px 16px 48px;
  -webkit-font-smoothing: antialiased;
}

.app-shell {
  max-width: 860px;
  margin: 0 auto;
}

/* ---------- Header ---------- */
.app-header {
  margin-bottom: 22px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 54px;
  height: 54px;
  flex: 0 0 54px;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: #fff;
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.5px;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-sm);
}

.brand-text h1 {
  font-size: 25px;
  letter-spacing: -0.3px;
  color: var(--ink);
}

.brand-text p {
  color: var(--ink-soft);
  font-size: 14.5px;
}

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 20px;
}

.card h2 {
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--brand);
  margin-bottom: 16px;
}

/* ---------- Form ---------- */
.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 6px;
}

.field input,
.field select {
  width: 100%;
  padding: 12px 13px;
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  background: #fbfcfe;
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}

.field input::placeholder {
  color: #9aa5bd;
}

.field input:focus,
.field select:focus {
  outline: none;
  background: #fff;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(108, 75, 212, 0.16);
}

.field-row {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 14px;
}

.error {
  color: var(--danger);
  font-size: 13.5px;
  font-weight: 600;
  min-height: 18px;
  margin-bottom: 8px;
}

.btn {
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  cursor: pointer;
  transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
}

.btn:active {
  transform: translateY(1px);
}

.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: #fff;
  box-shadow: 0 8px 20px rgba(108, 75, 212, 0.32);
}

.btn-primary:hover {
  box-shadow: 0 12px 28px rgba(108, 75, 212, 0.42);
}

/* ---------- List head ---------- */
.list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.list-head h2 {
  margin-bottom: 0;
}

.filters {
  display: inline-flex;
  background: var(--brand-soft);
  border-radius: 9px;
  padding: 3px;
  gap: 2px;
}

.filter-btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--brand);
  background: transparent;
  border: none;
  border-radius: 7px;
  padding: 7px 13px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.filter-btn.is-active {
  background: #fff;
  color: var(--brand-dark);
  box-shadow: var(--shadow-sm);
}

/* ---------- Task list ---------- */
.task-list {
  list-style: none;
}

.task-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  animation: fade-in 0.2s ease;
}

.task-item:last-child {
  border-bottom: none;
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.task-check {
  width: 21px;
  height: 21px;
  flex: 0 0 21px;
  margin-top: 2px;
  accent-color: var(--accent);
  cursor: pointer;
}

.task-body {
  flex: 1;
  min-width: 0;
}

.task-title {
  font-size: 15.5px;
  font-weight: 600;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.task-item.is-done .task-title {
  color: #94a0b8;
  text-decoration: line-through;
}

.task-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 5px;
}

.subject-chip {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: var(--brand);
  background: var(--brand-soft);
  border-radius: 6px;
  padding: 3px 9px;
}

.priority-chip {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  border-radius: 6px;
  padding: 3px 8px;
  color: #fff;
}

.priority-chip.High { background: var(--high); }
.priority-chip.Normal { background: var(--normal); }
.priority-chip.Low { background: var(--low); }

.task-item.is-done .subject-chip,
.task-item.is-done .priority-chip {
  opacity: 0.55;
}

.btn-delete {
  flex: 0 0 auto;
  font-size: 13px;
  font-weight: 600;
  color: var(--danger);
  background: #fdf0f0;
  border: 1px solid #f6d6d6;
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.btn-delete:hover {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

/* ---------- Empty state ---------- */
.empty-state {
  display: none;
  text-align: center;
  color: var(--ink-soft);
  font-size: 14.5px;
  padding: 34px 16px;
  background: #fafbfe;
  border: 1px dashed var(--line);
  border-radius: 12px;
}

.empty-state.is-visible {
  display: block;
}

.empty-icon {
  display: block;
  font-size: 30px;
  margin-bottom: 8px;
}

/* ---------- Summary ---------- */
.summary {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 13.5px;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.summary strong {
  color: var(--brand-dark);
}

/* ---------- Footer ---------- */
.app-footer {
  text-align: center;
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 8px;
}

.app-footer .muted {
  color: #98a3ba;
  font-size: 12.5px;
  margin-top: 3px;
}

/* ---------- Responsive ---------- */
@media (max-width: 560px) {
  body { padding: 18px 12px 40px; }
  .brand-text h1 { font-size: 21px; }
  .field-row { grid-template-columns: 1fr; }
  .list-head { flex-direction: column; align-items: flex-start; }
  .task-item { flex-wrap: wrap; }
}

  </style>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">SP</div>
        <div class="brand-text">
          <h1>Student Study Planner</h1>
          <p>Organise your study tasks and assignments in one place.</p>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="card add-card" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a new task</h2>
        <form id="task-form" novalidate>
          <div class="field">
            <label for="task-title">Task title</label>
            <input
              type="text"
              id="task-title"
              name="task-title"
              placeholder="e.g. Revise chapter 4 notes"
              autocomplete="off"
              maxlength="80"
            />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="task-subject">Subject / Course</label>
              <input
                type="text"
                id="task-subject"
                name="task-subject"
                placeholder="e.g. Introduction to Programming"
                autocomplete="off"
                maxlength="60"
              />
            </div>
            <div class="field">
              <label for="task-priority">Priority</label>
              <select id="task-priority" name="task-priority">
                <option value="Normal" selected>Normal</option>
                <option value="High">High</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>

          <p class="error" id="form-error" role="alert" aria-live="assertive"></p>

          <button type="submit" class="btn btn-primary" id="add-btn">
            <span aria-hidden="true">+</span> Add Task
          </button>
        </form>
      </section>

      <section class="card list-card" aria-labelledby="list-heading">
        <div class="list-head">
          <h2 id="list-heading">Your tasks</h2>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-btn is-active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
        </div>

        <ul id="task-list" class="task-list"></ul>

        <p class="empty-state" id="empty-state">
          <span class="empty-icon" aria-hidden="true">📚</span>
          <span id="empty-text">No tasks yet. Add your first study task above to get started.</span>
        </p>

        <div class="summary" id="summary"></div>
      </section>
    </main>
  </div>

  <script>
/* ---------------------------------------------------------
   storage.js
   Handles saving and loading tasks using the browser's
   localStorage. This means tasks stay on the page even
   after the user refreshes or closes the browser.
--------------------------------------------------------- */

const STORAGE_KEY = "atu-study-planner-tasks";

/**
 * Load all saved tasks from local storage.
 * Returns an empty array if nothing is saved yet.
 */
function loadTasks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    console.error("Could not read saved tasks:", error);
    return [];
  }
}

/**
 * Save the full list of tasks to local storage.
 */
function saveTasks(tasks) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (error) {
    console.error("Could not save tasks:", error);
  }
}

  </script>
  <script>
/* ---------------------------------------------------------
   app.js
   Main logic for the Student Study Planner.
   Features: add, display, complete/uncomplete, delete,
   input validation, empty message, saving after refresh,
   plus two small extras (priority label + status filter).
--------------------------------------------------------- */

// ---------- State ----------
let tasks = loadTasks();
let currentFilter = "all";

// ---------- Element references ----------
const form = document.getElementById("task-form");
const titleInput = document.getElementById("task-title");
const subjectInput = document.getElementById("task-subject");
const priorityInput = document.getElementById("task-priority");
const errorBox = document.getElementById("form-error");
const listEl = document.getElementById("task-list");
const emptyState = document.getElementById("empty-state");
const emptyText = document.getElementById("empty-text");
const summaryEl = document.getElementById("summary");
const filterButtons = document.querySelectorAll(".filter-btn");

// ---------- Helpers ----------
function createId() {
  return "task-" + Date.now() + "-" + Math.random().toString(16).slice(2, 8);
}

// Only safe, escaped text is ever placed into the page.
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function showError(message) {
  errorBox.textContent = message;
  if (message) {
    titleInput.setAttribute("aria-invalid", "true");
  } else {
    titleInput.removeAttribute("aria-invalid");
  }
}

// ---------- Rendering ----------
function getVisibleTasks() {
  if (currentFilter === "active") return tasks.filter((t) => !t.completed);
  if (currentFilter === "completed") return tasks.filter((t) => t.completed);
  return tasks;
}

function render() {
  const visible = getVisibleTasks();
  listEl.innerHTML = "";

  visible.forEach((task) => {
    const li = document.createElement("li");
    li.className = "task-item" + (task.completed ? " is-done" : "");
    li.dataset.id = task.id;

    li.innerHTML = `
      <input
        class="task-check"
        type="checkbox"
        ${task.completed ? "checked" : ""}
        aria-label="Mark task complete"
        data-action="toggle"
      />
      <div class="task-body">
        <div class="task-title">${escapeHtml(task.title)}</div>
        <div class="task-meta">
          ${task.subject ? `<span class="subject-chip">${escapeHtml(task.subject)}</span>` : ""}
          <span class="priority-chip ${escapeHtml(task.priority || "Normal")}">${escapeHtml(task.priority || "Normal")}</span>
        </div>
      </div>
      <button class="btn-delete" type="button" data-action="delete">Delete</button>
    `;

    listEl.appendChild(li);
  });

  // Empty message (also covers "no tasks match this filter")
  if (visible.length === 0) {
    emptyState.classList.add("is-visible");
    if (tasks.length === 0) {
      emptyText.textContent = "No tasks yet. Add your first study task above to get started.";
    } else if (currentFilter === "active") {
      emptyText.textContent = "No active tasks. Everything is complete. Well done!";
    } else {
      emptyText.textContent = "No completed tasks yet. Keep going!";
    }
  } else {
    emptyState.classList.remove("is-visible");
  }

  // Summary bar
  const total = tasks.length;
  const done = tasks.filter((t) => t.completed).length;
  summaryEl.innerHTML = `
    <span><strong>${total}</strong> task${total === 1 ? "" : "s"} total</span>
    <span><strong>${done}</strong> completed &middot; <strong>${total - done}</strong> remaining</span>
  `;
}

// ---------- Actions ----------
function addTask(event) {
  event.preventDefault();

  const title = titleInput.value.trim();
  const subject = subjectInput.value.trim();
  const priority = priorityInput.value;

  // Required feature: reject a blank title.
  if (!title) {
    showError("Please enter a task title before adding.");
    titleInput.focus();
    return;
  }

  showError("");

  tasks.push({
    id: createId(),
    title: title,
    subject: subject,
    priority: priority,
    completed: false,
    createdAt: new Date().toISOString(),
  });

  saveTasks(tasks);
  render();

  form.reset();
  priorityInput.value = "Normal";
  titleInput.focus();
}

function toggleTask(id) {
  const task = tasks.find((t) => t.id === id);
  if (!task) return;
  task.completed = !task.completed;
  saveTasks(tasks);
  render();
}

function deleteTask(id) {
  tasks = tasks.filter((t) => t.id !== id);
  saveTasks(tasks);
  render();
}

// ---------- Events ----------
form.addEventListener("submit", addTask);

listEl.addEventListener("click", (event) => {
  const action = event.target.dataset.action;
  if (!action) return;
  const id = event.target.closest(".task-item").dataset.id;
  if (action === "delete") deleteTask(id);
});

listEl.addEventListener("change", (event) => {
  if (event.target.dataset.action === "toggle") {
    const id = event.target.closest(".task-item").dataset.id;
    toggleTask(id);
  }
});

filterButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    filterButtons.forEach((b) => b.classList.remove("is-active"));
    btn.classList.add("is-active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

// ---------- Start ----------
render();

  </script>
</body>
